name: Development checks
on:
  push:
    branches: [dev/v2-workbench]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/core.test.mjs tests/gif.test.mjs
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - run: python tests/verify_gif.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-browser-evidence
          path: test-results/
